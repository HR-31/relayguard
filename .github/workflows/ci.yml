name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit + regression + cross-world tests
        run: python -m unittest discover -s tests -t . -v
      - name: Evaluation harness (smoke)
        run: python -m relayguard.evaluate
      - name: Locked-gap regression check
        run: python -m relayguard.gaps --check
      - name: Co-evolution loop (quick smoke)
        run: python -m relayguard.coevolve --quick --no-write
