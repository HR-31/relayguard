[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relayguard"
version = "0.2.0"
description = "Issuer-side detector for NFC contactless relay ('Ghost Tap') fraud."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Harish Ravi" }]
keywords = [
    "nfc", "emv", "contactless-payments", "fraud-detection",
    "relay-attack", "ghost-tap", "payment-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = []  # standard library only

[project.urls]
Homepage = "https://github.com/HR-31/relayguard"
Issues = "https://github.com/HR-31/relayguard/issues"

[project.scripts]
relayguard-eval = "relayguard.evaluate:main"

[tool.setuptools.packages.find]
include = ["relayguard*"]
